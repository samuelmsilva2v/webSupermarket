<div class="d-flex flex-column align-items-center justify-content-center mt-4 px-3">

    <div class="d-flex align-items-center gap-2 mb-4 text-primary">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 21c-4.97 0-9-4.03-9-9 0-6 6-10 15-10 0 9-4 10-10 10-2 0-3.5-.5-5-2"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="fonte-titulo fs-3">Supermercado</span>
    </div>

    <div class="card card-etiqueta p-4" style="width: 100%; max-width: 400px;">

        <h3 class="fonte-titulo text-center mb-1">Cadastro de usuário</h3>
        <p class="text-center text-muted">Entre com os seus dados</p>

        <div *ngIf="mensagemSucesso" class="text-success text-center">
            <strong>{{ mensagemSucesso }}</strong>
        </div>

        <div *ngIf="mensagemErro" class="text-danger text-center">
            <strong>{{ mensagemErro }}</strong>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">

            <div class="mb-3">
                <label for="nome" class="form-label">Nome do usuário</label>
                <input type="text" formControlName="nome" class="form-control" id="nome" placeholder="Digite seu nome" required>

                <div *ngIf="erros && erros.nome" class="text-danger">
                    <strong>{{ erros.nome }}</strong>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" formControlName="email" class="form-control" id="email" placeholder="Digite seu e-mail" required>

                <div *ngIf="erros && erros.email" class="text-danger">
                    <strong>{{ erros.email }}</strong>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" formControlName="senha" class="form-control" id="password" placeholder="Digite sua senha" required>

                <div *ngIf="erros && erros.senha" class="text-danger">
                    <strong>{{ erros.senha }}</strong>
                </div>
            </div>

            <div class="mb-3">
                <label for="senhaConfirmacao" class="form-label">Confirme a senha</label>
                <input type="password" formControlName="senhaConfirmacao" class="form-control" id="senhaConfirmacao" placeholder="Confirme sua senha" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Realizar Cadastro</button>
        </form>

    </div>

    <p class="text-center mt-3 mb-5">
        Já tem conta? <a routerLink="/pages/autenticar-usuario">Entrar</a>
    </p>

</div>
