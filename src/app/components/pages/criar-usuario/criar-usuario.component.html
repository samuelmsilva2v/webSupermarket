<div class="d-flex flex-column align-items-center justify-content-center mt-4 px-3">

    <div class="d-flex align-items-center gap-2 mb-4 text-primary">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 21c-4.97 0-9-4.03-9-9 0-6 6-10 15-10 0 9-4 10-10 10-2 0-3.5-.5-5-2"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="fonte-titulo fs-3">Supermercado</span>
    </div>

    <div class="card card-etiqueta p-4" style="width: 100%; max-width: 600px;">

        <h3 class="fonte-titulo text-center mb-1">Cadastrar usuário</h3>
        <p class="text-center text-muted">Preencha os dados do novo usuário</p>

        <div *ngIf="mensagemSucesso" class="text-success text-center">
            <strong>{{ mensagemSucesso }}</strong>
        </div>

        <div *ngIf="mensagemErro" class="text-danger text-center">
            <strong>{{ mensagemErro }}</strong>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">

            <div class="row">
                <div class="col-sm-6 mb-3">
                    <div class="form-floating">
                        <input type="text" formControlName="nome" class="form-control" id="nome" placeholder=" " required>
                        <label for="nome">Nome</label>
                    </div>

                    <div *ngIf="erros && erros.nome" class="text-danger">
                        <strong>{{ erros.nome }}</strong>
                    </div>
                </div>

                <div class="col-sm-6 mb-3">
                    <div class="form-floating">
                        <input type="text" formControlName="sobrenome" class="form-control" id="sobrenome" placeholder=" " required>
                        <label for="sobrenome">Sobrenome</label>
                    </div>

                    <div *ngIf="erros && erros.sobrenome" class="text-danger">
                        <strong>{{ erros.sobrenome }}</strong>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-6 mb-3">
                    <div class="form-floating">
                        <input type="text" formControlName="username" class="form-control" id="username" placeholder=" " required>
                        <label for="username">Username</label>
                    </div>

                    <div *ngIf="erros && erros.username" class="text-danger">
                        <strong>{{ erros.username }}</strong>
                    </div>
                </div>

                <div class="col-sm-6 mb-3">
                    <div class="form-floating">
                        <input type="email" formControlName="email" class="form-control" id="email" placeholder=" " required>
                        <label for="email">E-mail</label>
                    </div>

                    <div *ngIf="erros && erros.email" class="text-danger">
                        <strong>{{ erros.email }}</strong>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-6 mb-3">
                    <div class="form-floating">
                        <input type="password" formControlName="senha" class="form-control" id="password" placeholder=" " required>
                        <label for="password">Senha</label>
                    </div>
                    <div class="form-text">Mín. 8 caracteres, com maiúscula, número e símbolo.</div>

                    <div *ngIf="erros && erros.senha" class="text-danger">
                        <strong>{{ erros.senha }}</strong>
                    </div>
                </div>

                <div class="col-sm-6 mb-3">
                    <div class="form-floating">
                        <input type="password" formControlName="senhaConfirmacao" class="form-control" id="senhaConfirmacao" placeholder=" " required>
                        <label for="senhaConfirmacao">Confirme a senha</label>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-6 mb-3">
                    <div class="form-floating">
                        <select formControlName="perfil" class="form-select" id="perfil" required>
                            <option value="Operador">Operador</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                        <label for="perfil">Perfil de acesso</label>
                    </div>

                    <div *ngIf="erros && erros.perfil" class="text-danger">
                        <strong>{{ erros.perfil }}</strong>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-6">
                    <button type="button" class="btn btn-outline-secondary w-100" (click)="voltar()">Voltar</button>
                </div>

                <div class="col-sm-6">
                    <button type="submit" class="btn btn-primary w-100">Realizar Cadastro</button>
                </div>
            </div>
        </form>

    </div>

</div>
