<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">

            <div class="mb-4">
                <h2 class="fonte-titulo mb-1">Olá, {{ nomeUsuario }}</h2>
                <p class="text-muted mb-0">Aqui está o panorama do seu estoque hoje.</p>
            </div>

            <div class="card card-etiqueta p-4">
                <div class="row g-4 align-items-center">

                    <div class="col-md-5">
                        <table class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Categoria</th>
                                    <th class="text-end">Produtos</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of dados">
                                    <td>
                                        <span class="badge-categoria">
                                            <span class="ponto" [style.background-color]="corDaCategoria(item.nomeCategoria)"></span>
                                            {{ item.nomeCategoria }}
                                        </span>
                                    </td>
                                    <td class="text-end numero">{{ item.qtdProdutos }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="col-md-7">
                        <div [chart]="grafico"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
