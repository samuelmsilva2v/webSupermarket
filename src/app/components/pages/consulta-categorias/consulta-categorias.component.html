<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="mb-4">
                <h2 class="fonte-titulo mb-1">Consulta de categorias</h2>
                <p class="text-muted mb-0">Veja, edite ou exclua as categorias cadastradas.</p>
            </div>

            <div *ngIf="mensagem" class="alert alert-success">
                <strong>Sucesso!</strong> {{ mensagem }}
            </div>

            <div *ngIf="erroExclusao" class="alert alert-danger">
                <strong>Erro!</strong> {{ erroExclusao }}
            </div>

            <div class="row g-3" *ngIf="categorias.length > 0">
                <div class="col-md-6 col-lg-4" *ngFor="let c of categorias">
                    <div class="card card-etiqueta p-3 h-100 d-flex flex-column">
                        <span class="badge-categoria mb-2">
                            <span class="ponto" [style.background-color]="corDaCategoria(c.nome)"></span>
                            {{ c.nome }}
                        </span>

                        <div class="mt-auto d-flex gap-2">
                            <button [routerLink]="['/pages/edicao-categorias', c.id]" class="btn btn-warning btn-sm flex-grow-1">Atualizar</button>
                            <button (click)="onDelete(c.id)" class="btn btn-danger btn-sm flex-grow-1">Excluir</button>
                        </div>
                    </div>
                </div>
            </div>

            <p *ngIf="categorias.length === 0" class="text-muted text-center mt-4">
                Nenhuma categoria cadastrada ainda.
            </p>

        </div>
    </div>
</div>

<app-confirm-modal [open]="exibirConfirmacaoExclusao" title="Excluir categoria"
    message="Deseja realmente excluir a categoria selecionada?" confirmText="Excluir" cancelText="Cancelar"
    variant="danger" (confirmed)="confirmarExclusao()" (cancelled)="cancelarExclusao()">
</app-confirm-modal>
