<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="mb-4">
                <h2 class="fonte-titulo mb-1">Cadastro de produto</h2>
                <p class="text-muted mb-0">Preencha os dados para incluir um novo item no estoque.</p>
            </div>

            <div class="card card-etiqueta p-4">

                <div *ngIf="mensagem" class="alert alert-success">
                    <strong>Sucesso!</strong> Produto cadastrado com sucesso.
                </div>

                <form [formGroup]="form" (ngSubmit)="onSubmit()">

                    <div class="mb-3">
                        <div class="form-floating">
                            <input type="text" formControlName="nome" class="form-control" id="nome"
                                placeholder=" " required>
                            <label for="nome">Nome do Produto</label>
                        </div>

                        <div *ngIf="erros && erros.nome" class="text-danger">
                            <strong>{{ erros.nome }}</strong>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-6 mb-3">
                            <div class="form-floating">
                                <input type="number" formControlName="preco" class="form-control numero" id="preco"
                                    placeholder=" " step="0.01" required #precoInput (blur)="formatarPreco(precoInput)">
                                <label for="preco">Preço</label>
                            </div>
                            <div class="form-text">Use vírgula para decimais, ex.: 9,90.</div>

                            <div *ngIf="erros && erros.preco" class="text-danger">
                                <strong>{{ erros.preco }}</strong>
                            </div>
                        </div>

                        <div class="col-sm-6 mb-3">
                            <div class="form-floating">
                                <input type="number" formControlName="quantidade" class="form-control numero" id="quantidade"
                                    placeholder=" " required>
                                <label for="quantidade">Quantidade</label>
                            </div>

                            <div *ngIf="erros && erros.quantidade" class="text-danger">
                                <strong>{{ erros.quantidade }}</strong>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="form-floating">
                            <select class="form-select" formControlName="categoriaId" id="categoria"
                                (change)="onCategoriaChange()" required>
                                <option value="" disabled selected>Selecione a categoria</option>

                                <option *ngFor="let c of categorias" value="{{ c.id }}">
                                    {{ c.nome }}
                                </option>
                            </select>
                            <label for="categoria" class="d-flex align-items-center gap-2">
                                Categoria
                                <span *ngIf="corSelecionada" class="ponto" [style.background-color]="corSelecionada"></span>
                            </label>
                        </div>

                        <div *ngIf="erros && erros.categoriaId" class="text-danger">
                            <strong>{{ erros.categoriaId }}</strong>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-6">
                            <button type="button" class="btn btn-outline-secondary w-100" (click)="voltar()">Voltar</button>
                        </div>

                        <div class="col-sm-6">
                            <button type="submit" class="btn btn-primary w-100">Cadastrar Produto</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
